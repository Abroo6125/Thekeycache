<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KeyCache Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="admin-page">

    <section class="admin-card">

      <div class="badge">
        KeyCache Admin
      </div>

      <h1>Import a Product</h1>

      <p class="admin-intro">
        Paste a supplier product link. KeyCache will try to pull the product information automatically.
      </p>


      <!-- IMPORT -->

      <div class="import-box">

        <label>
          Supplier Product URL
          <input
            id="productUrl"
            type="url"
            placeholder="https://supplier.com/product/..."
          >
        </label>

        <label>
          Affiliate URL
          <span class="optional">(optional)</span>

          <input
            id="affiliateUrl"
            type="url"
            placeholder="Paste your affiliate tracking link here"
          >
        </label>

        <button id="importButton" type="button">
          Import Product
        </button>

        <div id="importMessage"></div>

      </div>


      <!-- REVIEW / EDIT -->

      <form id="productForm" class="review-section" hidden>

        <h2 id="reviewHeading">Review Product</h2>

        <p class="review-note">
          Check the information below before saving it to KeyCache.
        </p>

        <div class="form-grid">

          <label class="full-width">
            Product Title
            <input id="title" required>
          </label>

          <label>
            Vehicle
            <input id="vehicle">
          </label>

          <label>
            Years
            <input id="years" placeholder="2023-2024">
          </label>

          <label>
            FCC ID
            <input id="fccId">
          </label>

          <label>
            OEM / Part Number
            <input id="oemPart">
          </label>

          <label>
            Frequency
            <input id="frequency" placeholder="315 MHz">
          </label>

          <label>
            Chip ID
            <input id="chipId" placeholder="4D63 80 Bit">
          </label>

          <label class="full-width">
            Button Configuration
            <input
            id="buttonConfiguration"
             placeholder="5 Button / Remote Start / Hatch"
            >
          </label>
          <label>
            Buttons
            <input id="buttons" placeholder="5 Button">
          </label>

          <label>
            Condition / Type
            <input id="conditionType">
          </label>

          <label>
            Supplier
            <input id="supplierName" required>
          </label>

          <label>
            Supplier Product ID
            <input id="supplierProductId">
          </label>

          <label>
            Price
            <input
              id="price"
              type="number"
              step="0.01"
            >
          </label>

          <label>
            Stock Status
            <input
              id="stockStatus"
              placeholder="In stock"
            >
          </label>

          <label>
            Shipping
            <input
              id="shipping"
              placeholder="Check supplier"
            >
          </label>

          <label class="checkbox-row">
            <input
              type="checkbox"
              id="remoteStart"
            >
            Remote Start
          </label>

          <label class="full-width">
            Notes
            <input id="notes">
          </label>

        </div>


        <div class="source-links">

          <p>
            <strong>Supplier URL:</strong>
            <span id="sourceUrlDisplay"></span>
          </p>

          <p>
            <strong>Affiliate URL:</strong>
            <span id="affiliateUrlDisplay"></span>
          </p>

        </div>


        <button
          type="submit"
          class="save-button"
          id="saveButton"
        >
          Save to KeyCache
        </button>

        <button
          type="button"
          id="cancelEditButton"
          class="secondary-button"
          hidden
        >
          Cancel Edit
        </button>

        <div id="saveMessage"></div>

      </form>


      <!-- EXISTING PRODUCTS -->

      <div class="existing-products">

        <div class="existing-products-header">

          <h2>Existing Products</h2>

          <button
            type="button"
            id="refreshProducts"
            class="secondary-button"
          >
            Refresh
          </button>

        </div>

        <div id="productList">
          Loading products...
        </div>

      </div>

    </section>

  </main>


<script>

  const importButton =
    document.getElementById("importButton");

  const productUrl =
    document.getElementById("productUrl");

  const affiliateUrl =
    document.getElementById("affiliateUrl");

  const importMessage =
    document.getElementById("importMessage");

  const productForm =
    document.getElementById("productForm");

  const saveMessage =
    document.getElementById("saveMessage");

  const productList =
    document.getElementById("productList");

  const refreshProducts =
    document.getElementById("refreshProducts");

  const reviewHeading =
    document.getElementById("reviewHeading");

  const saveButton =
    document.getElementById("saveButton");

  const cancelEditButton =
    document.getElementById("cancelEditButton");


  // =============================
  // IMPORT PRODUCT
  // =============================

  importButton.addEventListener(
    "click",
    async function () {

      const url =
        productUrl.value.trim();

      if (!url) {
        importMessage.textContent =
          "Paste a supplier product URL first.";
        return;
      }

      importButton.disabled = true;
      importButton.textContent = "Importing...";
      importMessage.textContent =
        "Reading supplier page...";

      try {

        const response =
          await fetch(
            "/api/import-product",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                url: url
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            "Unable to import product."
          );
        }

        const data =
          result.data || {};

        document.getElementById("title").value =
          data.title || "";

        document.getElementById("supplierName").value =
          data.supplierName || "";

        document.getElementById("supplierProductId").value =
          data.supplierProductId || "";

        document.getElementById("conditionType").value =
          data.conditionType || "";

        document.getElementById("price").value =
          data.price ?? "";

        document.getElementById("stockStatus").value =
          data.stockStatus || "";

        document.getElementById("shipping").value =
          "Check supplier";

        document.getElementById(
          "sourceUrlDisplay"
        ).textContent = url;

        document.getElementById(
          "affiliateUrlDisplay"
        ).textContent =
          affiliateUrl.value.trim() ||
          "None";

        delete productForm.dataset.productId;
        delete productForm.dataset.listingId;

        reviewHeading.textContent =
          "Review Product";

        saveButton.textContent =
          "Save to KeyCache";

        cancelEditButton.hidden = true;

        productForm.hidden = false;

        if (result.blocked) {
          importMessage.textContent =
            "Supplier blocked automatic reading. Fill in the missing fields below.";
        } else {
          importMessage.textContent =
            "Import complete. Review the fields below.";
        }

        productForm.scrollIntoView({
          behavior: "smooth"
        });

      } catch (error) {

        console.error(error);

        importMessage.textContent =
          "Import failed: " +
          error.message;

      } finally {

        importButton.disabled = false;
        importButton.textContent =
          "Import Product";

      }
    }
  );


  // =============================
  // SAVE OR UPDATE
  // =============================

  productForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      saveMessage.textContent =
        "Saving...";

      const data = {

        title:
          document.getElementById("title").value.trim(),

        vehicle:
          document.getElementById("vehicle").value.trim(),

        years:
          document.getElementById("years").value.trim(),

        fccId:
          document.getElementById("fccId").value.trim(),

        oemPart:
          document.getElementById("oemPart").value.trim(),

        buttons:
          document.getElementById("buttons").value.trim(),

        frequency:
          document.getElementById("frequency").value.trim(),

        chipId:
          document.getElementById("chipId").value.trim(),

        buttonConfiguration:
          document.getElementById("buttonConfiguration").value.trim(),

        remoteStart:
          document.getElementById("remoteStart").checked,

        notes:
          document.getElementById("notes").value.trim(),

        supplierName:
          document.getElementById("supplierName").value.trim(),

        supplierProductId:
          document.getElementById("supplierProductId").value.trim(),

        conditionType:
          document.getElementById("conditionType").value.trim(),

        price:
          document.getElementById("price").value
            ? Number(
                document.getElementById("price").value
              )
            : null,

        stockStatus:
          document.getElementById("stockStatus").value.trim(),

        shipping:
          document.getElementById("shipping").value.trim(),

        url:
          productUrl.value.trim(),

        affiliateUrl:
          affiliateUrl.value.trim()
      };


      const editingProduct =
        productForm.dataset.productId;


      if (editingProduct) {

        data.productId =
          Number(
            productForm.dataset.productId
          );

        data.listingId =
          Number(
            productForm.dataset.listingId
          );
      }


      try {

        const response =
          await fetch(
            editingProduct
              ? "/api/admin/products"
              : "/api/products",
            {
              method:
                editingProduct
                  ? "PUT"
                  : "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(data)
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            result.details ||
            "Unable to save product."
          );
        }

        saveMessage.textContent =
          editingProduct
            ? "✓ Product updated!"
            : "✓ Product saved to KeyCache!";

        delete productForm.dataset.productId;
        delete productForm.dataset.listingId;

        reviewHeading.textContent =
          "Review Product";

        saveButton.textContent =
          "Save to KeyCache";

        cancelEditButton.hidden = true;

        await loadProducts();

      } catch (error) {

        console.error(error);

        saveMessage.textContent =
          "Save failed: " +
          error.message;
      }
    }
  );


  // =============================
  // LOAD EXISTING PRODUCTS
  // =============================

  async function loadProducts() {

    productList.innerHTML =
      "<p>Loading products...</p>";

    try {

      const response =
        await fetch(
          "/api/admin/products"
        );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Unable to load products."
        );
      }

      const products =
        Array.isArray(result.products)
          ? result.products
          : [];

      if (products.length === 0) {

        productList.innerHTML =
          "<p>No products yet.</p>";

        return;
      }

      productList.innerHTML =
        products.map(product => {

          const title =
            product.title ||
            "Untitled Product";

          const supplier =
            product.supplier_name ||
            "No supplier";

          const price =
            typeof product.price === "number"
              ? "$" +
                product.price.toFixed(2)
              : "No price";

          const encodedProduct =
            encodeURIComponent(
              JSON.stringify(product)
            );

          return `
            <div class="admin-product-card">

              <div class="admin-product-info">

                <strong>
                  ${escapeHtml(title)}
                </strong>

                <span>
                  ${escapeHtml(supplier)}
                </span>

                <span>
                  ${price}
                </span>

              </div>


              <div class="admin-product-actions">

                <button
                  type="button"
                  class="edit-product"
                  data-product="${encodedProduct}"
                >
                  Edit
                </button>

                <button
                  type="button"
                  class="delete-product"
                  data-product-id="${product.id}"
                >
                  Delete
                </button>

              </div>

            </div>
          `;
        }).join("");

    } catch (error) {

      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );

      productList.innerHTML = `
        <p>
          Unable to load products:
          ${escapeHtml(error.message)}
        </p>
      `;
    }
  }


  // =============================
  // EDIT / DELETE BUTTONS
  // =============================

  productList.addEventListener(
    "click",
    async function (event) {

      const editButton =
        event.target.closest(
          ".edit-product"
        );

      const deleteButton =
        event.target.closest(
          ".delete-product"
        );


      // EDIT

      if (editButton) {

        const product =
          JSON.parse(
            decodeURIComponent(
              editButton.dataset.product
            )
          );

        document.getElementById("title").value =
          product.title || "";

        document.getElementById("vehicle").value =
          product.vehicle || "";

        document.getElementById("years").value =
          product.years || "";

        document.getElementById("fccId").value =
          product.fcc_id || "";

        document.getElementById("oemPart").value =
          product.oem_part || "";

        document.getElementById("buttons").value =
          product.buttons || "";

        document.getElementById("frequency").value =
          product.frequency || "";

        document.getElementById("chipId").value =
          product.chip_id || "";

        document.getElementById("buttonConfiguration").value =
          product.button_configuration || "";

        document.getElementById("remoteStart").checked =
          Boolean(product.remote_start);

        document.getElementById("notes").value =
          product.notes || "";

        document.getElementById("supplierName").value =
          product.supplier_name || "";

        document.getElementById("supplierProductId").value =
          product.supplier_product_id || "";

        document.getElementById("conditionType").value =
          product.condition_type || "";

        document.getElementById("price").value =
          product.price ?? "";

        document.getElementById("stockStatus").value =
          product.stock_status || "";

        document.getElementById("shipping").value =
          product.shipping || "";

        productUrl.value =
          product.url || "";

        affiliateUrl.value =
          product.affiliate_url || "";

        document.getElementById(
          "sourceUrlDisplay"
        ).textContent =
          product.url || "";

        document.getElementById(
          "affiliateUrlDisplay"
        ).textContent =
          product.affiliate_url ||
          "None";

        productForm.dataset.productId =
          product.id;

        productForm.dataset.listingId =
          product.listing_id;

        reviewHeading.textContent =
          "Edit Product";

        saveButton.textContent =
          "Save Changes";

        cancelEditButton.hidden = false;

        saveMessage.textContent = "";

        productForm.hidden = false;

        productForm.scrollIntoView({
          behavior: "smooth"
        });

        return;
      }


      // DELETE

      if (deleteButton) {

        const productId =
          deleteButton.dataset.productId;

        const confirmed =
          confirm(
            "Delete this product from KeyCache?"
          );

        if (!confirmed) {
          return;
        }

        try {

          const response =
            await fetch(
              "/api/admin/products",
              {
                method: "DELETE",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    productId
                  })
              }
            );

          const result =
            await response.json();

          if (!response.ok) {
            throw new Error(
              result.error ||
              "Delete failed."
            );
          }

          await loadProducts();

        } catch (error) {

          alert(
            "Delete failed: " +
            error.message
          );
        }
      }
    }
  );


  // =============================
  // CANCEL EDIT
  // =============================

  cancelEditButton.addEventListener(
    "click",
    function () {

      delete productForm.dataset.productId;
      delete productForm.dataset.listingId;

      productForm.reset();

      productForm.hidden = true;

      reviewHeading.textContent =
        "Review Product";

      saveButton.textContent =
        "Save to KeyCache";

      cancelEditButton.hidden = true;

      saveMessage.textContent = "";
    }
  );


  refreshProducts.addEventListener(
    "click",
    loadProducts
  );


  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // Load products immediately
  loadProducts();

</script>

</body>
</html>
